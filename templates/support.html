{% extends "base.html" %}

{% block title %}{{ t('support_chat') }} - {{ bot_name }}{% endblock %}

{% block extra_head %}
<style>
/* Support chat styles */
.support-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 40px 20px;
}

.support-header {
    text-align: center;
    margin-bottom: 40px;
}

.support-header h1 {
    font-size: 2.5rem;
    font-weight: 900;
    background: var(--diamond-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
}

.support-header p {
    color: var(--light-gray);
    font-size: 18px;
    line-height: 1.5;
}

.chat-container {
    background: var(--glass-gradient);
    border-radius: var(--radius-xl);
    border: 1px solid rgba(30, 58, 138, 0.2);
    backdrop-filter: blur(20px);
    overflow: hidden;
    box-shadow: var(--shadow-glass);
}

.chat-messages {
    height: 400px;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.message {
    max-width: 70%;
    padding: 12px 16px;
    border-radius: var(--radius-lg);
    font-size: 14px;
    line-height: 1.4;
}

.message-user {
    align-self: flex-end;
    background: var(--diamond-gradient);
    color: var(--pure-white);
    border-bottom-right-radius: 4px;
}

.message-admin {
    align-self: flex-start;
    background: rgba(255, 255, 255, 0.1);
    color: var(--pure-white);
    border-bottom-left-radius: 4px;
}

.message-time {
    font-size: 12px;
    opacity: 0.7;
    margin-top: 4px;
}

.message-role {
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
    opacity: 0.8;
    text-transform: uppercase;
}

.message-user .message-role {
    color: rgba(255, 255, 255, 0.85);
    text-align: right;
}

.message-admin .message-role {
    color: var(--pure-white);
    opacity: 0.7;
    text-align: left;
}

.chat-input-container {
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding: 20px;
}

.chat-input-form {
    display: flex;
    gap: 12px;
}

.chat-input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid rgba(30, 58, 138, 0.2);
    border-radius: var(--radius-lg);
    background: rgba(255, 255, 255, 0.05);
    color: var(--pure-white);
    font-size: 16px;
    transition: var(--transition-normal);
    backdrop-filter: blur(10px);
}

.chat-input:focus {
    outline: none;
    border-color: var(--diamond-blue);
    box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
}

.chat-send-btn {
    background: var(--diamond-gradient);
    color: var(--pure-white);
    padding: 12px 24px;
    font-size: 16px;
    font-weight: 600;
    border-radius: var(--radius-lg);
    border: none;
    cursor: pointer;
    transition: var(--transition-normal);
    box-shadow: var(--shadow-button);
}

.chat-send-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(30, 58, 138, 0.4);
}

.chat-send-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.no-messages {
    text-align: center;
    color: var(--medium-gray);
    font-style: italic;
    padding: 40px;
}

.loading {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: var(--diamond-blue);
    animation: spin 1s ease-in-out infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* ===== MOBILE RESPONSIVE DESIGN ===== */

@media (max-width: 768px) {
    .support-container {
        margin: calc(20px + 80px) auto 20px;
        padding: 0 20px;
        max-width: 100%;
    }

    .support-header {
        margin-bottom: 32px;
        text-align: center;
    }

    .support-header h1 {
        font-size: 2.2rem;
        line-height: 1.2;
        font-weight: 800;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
    }

    .support-header h1 .form-icon {
        width: 36px !important;
        height: 36px !important;
        margin-right: 8px !important;
    }

    .support-header p {
        font-size: 1rem;
        line-height: 1.5;
        opacity: 0.9;
        max-width: 100%;
    }

    .chat-container {
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .chat-messages {
        height: calc(100vh - 350px);
        min-height: 300px;
        max-height: 500px;
        padding: 20px;
        gap: 16px;
    }

    .message {
        max-width: 85%;
        padding: 14px 18px;
        border-radius: 18px;
        font-size: 15px;
        line-height: 1.4;
        word-wrap: break-word;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .message-user {
        border-bottom-right-radius: 6px;
        align-self: flex-end;
    }

    .message-admin {
        border-bottom-left-radius: 6px;
        align-self: flex-start;
    }

    .message-time {
        font-size: 11px;
        opacity: 0.7;
        margin-top: 6px;
        text-align: right;
    }

    .message-admin .message-time {
        text-align: left;
    }

    .chat-input-container {
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        padding: 20px;
    }

    .chat-input-form {
        display: flex;
        gap: 12px;
        align-items: flex-end;
    }

    .chat-input {
        flex: 1;
        padding: 16px 18px;
        border: 2px solid rgba(30, 58, 138, 0.2);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.05);
        color: var(--pure-white);
        font-size: 16px; /* Prevent zoom on iOS */
        line-height: 1.4;
        min-height: 48px;
        resize: none;
        backdrop-filter: blur(10px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .chat-input:focus {
        outline: none;
        border-color: var(--diamond-blue);
        box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15);
        background: rgba(255, 255, 255, 0.08);
    }

    .chat-send-btn {
        background: var(--diamond-gradient);
        color: var(--pure-white);
        padding: 16px 24px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 16px;
        border: none;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 16px rgba(30, 58, 138, 0.3);
        min-height: 48px;
        white-space: nowrap;
        flex-shrink: 0;
    }

    .chat-send-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(30, 58, 138, 0.4);
    }

    .chat-send-btn:active {
        transform: translateY(0);
    }

    .chat-send-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
        box-shadow: 0 2px 8px rgba(30, 58, 138, 0.2);
    }

    .no-messages {
        text-align: center;
        color: var(--medium-gray);
        font-style: italic;
        padding: 60px 20px;
        font-size: 1rem;
        opacity: 0.8;
    }

    .loading {
        display: inline-block;
        width: 24px;
        height: 24px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: var(--diamond-blue);
        animation: spin 1s ease-in-out infinite;
    }

    /* Enhanced touch targets */
    .chat-input {
        min-height: 48px;
        touch-action: manipulation;
    }

    .chat-send-btn {
        min-width: 80px;
        min-height: 48px;
        touch-action: manipulation;
    }

    /* Better spacing for mobile */
    .support-container {
        padding-bottom: 32px;
    }

    /* Improved typography for mobile */
    .support-header h1 {
        letter-spacing: -0.5px;
    }

    /* Better visual hierarchy */
    .chat-container {
        position: relative;
        overflow: hidden;
    }

    .chat-container::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.02), transparent);
        transition: left 1s ease;
        z-index: -1;
    }

    .chat-container:hover::before {
        left: 100%;
    }

    /* Scroll improvements for mobile */
    .chat-messages::-webkit-scrollbar {
        width: 6px;
    }

    .chat-messages::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 3px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 3px;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.5);
    }
}


@media (max-width: 480px) {
    .support-container {
        margin: calc(20px + 80px) auto 20px;
        padding: 0 16px;
    }

    .support-header {
        margin-bottom: 24px;
    }

    .support-header h1 {
        font-size: 1.8rem;
        flex-direction: column;
        gap: 8px;
    }

    .support-header h1 .form-icon {
        width: 32px !important;
        height: 32px !important;
        margin-right: 0 !important;
    }

    .support-header p {
        font-size: 0.95rem;
    }

    .chat-messages {
        height: calc(100vh - 320px);
        min-height: 250px;
        padding: 16px;
    }

    .message {
        max-width: 90%;
        padding: 12px 16px;
        font-size: 14px;
    }

    .chat-input-container {
        padding: 16px;
    }

    .chat-input {
        padding: 14px 16px;
        font-size: 16px;
        min-height: 44px;
    }

    .chat-send-btn {
        padding: 14px 20px;
        font-size: 15px;
        min-height: 44px;
        min-width: 70px;
    }

    .no-messages {
        padding: 40px 16px;
        font-size: 0.95rem;
    }
}
</style>
{% endblock %}

{% block content %}
<div class="support-container">
    <div class="support-header">
        <h1>
            <svg class="form-icon" viewBox="0 0 24 24" fill="currentColor" style="width: 40px; height: 40px; margin-right: 16px; vertical-align: middle;">
                <path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2Z"/>
            </svg>
            {{ t('support_chat') }}
        </h1>
        <p>{{ t('support_chat_desc') }}</p>
    </div>

    <div class="chat-container">
        <div id="chatMessages" class="chat-messages">
            <div class="no-messages">{{ t('support_no_messages') }}</div>
        </div>

        <div class="chat-input-container">
            <form id="chatForm" class="chat-input-form">
                <input
                    type="text"
                    id="messageInput"
                    class="chat-input"
                    placeholder="{{ t('support_message_placeholder') }}"
                    maxlength="1000"
                    required
                >
                <button type="submit" id="sendButton" class="chat-send-btn">
                    {{ t('send') }}
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_scripts %}
<script>
let messagesLoaded = false;

async function loadMessages() {
    try {
        const response = await fetch('/api/support/messages');
        const data = await response.json();

        if (data.success) {
            displayMessages(data.messages);
            messagesLoaded = true;

            // Mark messages as read when user enters chat
            await markMessagesAsRead();

            // Scroll to bottom
            const messagesContainer = document.getElementById('chatMessages');
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        } else {
            showError(data.message || '{{ t("support_load_error") }}');
        }
    } catch (error) {
        console.error('Error loading messages:', error);
        showError('{{ t("network_error") }}');
    }
}

function displayMessages(messages) {
    const container = document.getElementById('chatMessages');

    if (messages.length === 0) {
        container.innerHTML = '<div class="no-messages">{{ t("support_no_messages") }}</div>';
        return;
    }

    container.innerHTML = messages.map(msg => {
        const roleLabel = msg.is_from_user ? '{{ t("support_role_user") }}' : '{{ t("support_role_admin") }}';
        return `
            <div class="message message-${msg.is_from_user ? 'user' : 'admin'}">
                <div class="message-role">${roleLabel}</div>
                ${msg.message}
                <div class="message-time">${formatTime(msg.created_at)}</div>
            </div>
        `;
    }).join('');
}

function formatTime(dateString) {
    const date = new Date(dateString);
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

async function sendMessage(event) {
    event.preventDefault();

    const input = document.getElementById('messageInput');
    const button = document.getElementById('sendButton');
    const message = input.value.trim();

    if (!message) return;

    // Disable input and button
    input.disabled = true;
    button.disabled = true;
    button.innerHTML = '<div class="loading"></div>';

    try {
        const response = await fetch('/api/support/send-message', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ message })
        });

        const data = await response.json();

        if (data.success) {
            input.value = '';
            // Reload messages to show the new message
            await loadMessages();
        } else {
            showError(data.message || '{{ t("support_send_error") }}');
        }
    } catch (error) {
        console.error('Error sending message:', error);
        showError('{{ t("network_error") }}');
    } finally {
        // Re-enable input and button
        input.disabled = false;
        button.disabled = false;
        button.textContent = '{{ t("send") }}';
    }
}

async function markMessagesAsRead() {
    try {
        const response = await fetch('/api/support/mark-read', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            }
        });

        const data = await response.json();
        if (!data.success) {
            console.warn('Failed to mark messages as read:', data.message);
        }
    } catch (error) {
        console.error('Error marking messages as read:', error);
    }
}

function showError(message) {
    if (typeof window.siteNotify === 'function') {
        window.siteNotify(message, 'error', { duration: 4000 });
        return;
    }
    if (typeof window.showToast === 'function') {
        window.showToast(message, 'error', { duration: 4000 });
        return;
    }
    alert(message);
}

document.addEventListener('DOMContentLoaded', function() {
    loadMessages();

    // Reload messages every 30 seconds
    setInterval(loadMessages, 30000);

    // Handle form submission
    document.getElementById('chatForm').addEventListener('submit', sendMessage);

    // Handle Enter key
    document.getElementById('messageInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage(e);
        }
    });
});
</script>
{% endblock %}
